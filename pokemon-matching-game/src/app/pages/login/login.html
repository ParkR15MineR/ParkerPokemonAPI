<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Pokémon Match</mat-card-title>
      <mat-card-subtitle>Sign in to play</mat-card-subtitle>
    </mat-card-header>
    <mat-card-actions align="center">
      <button mat-raised-button color="primary" (click)="handleLogin()">
        Login with Google
      </button>
    </mat-card-actions>
  </mat-card>
</div>
